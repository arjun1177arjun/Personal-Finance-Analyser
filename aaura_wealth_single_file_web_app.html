    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const StockRegistry = [
          { symbol: "RELIANCE", name: "Reliance Industries Ltd.", exchange: "NSE" },
          { symbol: "TCS", name: "Tata Consultancy Services Ltd.", exchange: "NSE" },

        function formatDateString(dateStr) {
          if (!dateStr) return "N/A";
          const dateObj = new Date(dateStr);
          if (isNaN(dateObj.getTime())) return dateStr;
          const day = String(dateObj.getDate()).padStart(2, '0');
          const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
          return `${day}-${months[dateObj.getMonth()]}-${dateObj.getFullYear()}`;
        }

        function formatINR(number) {
          if (number === null || number === undefined || isNaN(number)) return "₹0.00";
          return new Intl.NumberFormat('en-IN', {
            style: 'currency',
            currency: 'INR',
            maximumFractionDigits: 2
          }).format(number);
        }

        function generateId() {
          return Math.random().toString(36).substring(2, 11);
        }

        const DefaultProfiles = [
          {
            id: "prof-nikita",
            name: "Nikita",
            initials: "NI",
            realizedPnL: 8250.00,
            synced: false,
            holdings: {
              "RELIANCE": {
                ticker: "RELIANCE",
                name: "Reliance Industries Ltd.",
                buyLots: [
                  { id: "lot-r1", date: "2025-01-10", price: 2420.00, qty: 15 },
                  { id: "lot-r2", date: "2025-03-15", price: 2510.00, qty: 10 }
                ],
                gttPrice: 2800.00,
                price: null,
                prevClose: null
              },
              "TCS": {
                ticker: "TCS",
                name: "Tata Consultancy Services Ltd.",
                buyLots: [
                  { id: "lot-t1", date: "2024-11-20", price: 3850.00, qty: 8 }
                ],
                gttPrice: null,
                price: null,
                prevClose: null
              },
              "AAPL": {
                ticker: "AAPL",
                name: "Apple Inc.",
                buyLots: [
                  { id: "lot-a1", date: "2025-02-05", price: 175.00, qty: 20 }
                ],
                gttPrice: 210.00,
                price: null,
                prevClose: null
              }
            },
            logs: [
              { id: "log-1", date: "2024-11-20T10:00:00.000Z", type: "SYSTEM", text: "Profile initiated with default tracker state." },
              { id: "log-2", date: "2024-11-20T10:05:00.000Z", type: "BUY", text: "Acquired 8 lots of TCS at ₹3850.00", amount: 30800 },
              { id: "log-3", date: "2025-01-10T14:30:00.000Z", type: "BUY", text: "Acquired 15 lots of RELIANCE at ₹2420.00", amount: 36300 },
              { id: "log-4", date: "2025-02-05T15:15:00.000Z", type: "BUY", text: "Acquired 20 lots of AAPL at ₹175.00", amount: 3500 },
              { id: "log-5", date: "2025-03-15T09:45:00.000Z", type: "BUY", text: "Acquired 10 lots of RELIANCE at ₹2510.00", amount: 25100 }
            ]
          },
          {
            id: "prof-aarav",
            name: "Aarav",
            initials: "AR",
            realizedPnL: 0.00,
            synced: false,
            holdings: {
              "TSLA": {
                ticker: "TSLA",
                name: "Tesla, Inc.",
                buyLots: [
                  { id: "lot-ts1", date: "2024-12-01", price: 220.00, qty: 12 },
                  { id: "lot-ts2", date: "2025-02-18", price: 195.00, qty: 8 }
                ],
                gttPrice: 260.00,
                price: null,
                prevClose: null
              },
              "INFY": {
                ticker: "INFY",
                name: "Infosys Ltd.",
                buyLots: [
                  { id: "lot-inf1", date: "2025-04-10", price: 1420.00, qty: 30 }
                ],
                gttPrice: null,
                price: null,
                prevClose: null
              }
            },
            logs: [
              { id: "log-a1", date: "2024-12-01T10:00:00.000Z", type: "SYSTEM", text: "Profile initiated with default tracker state." },
              { id: "log-a2", date: "2024-12-01T10:15:00.000Z", type: "BUY", text: "Acquired 12 lots of TSLA at ₹220.00", amount: 2640 },
              { id: "log-a3", date: "2025-02-18T11:00:00.000Z", type: "BUY", text: "Acquired 8 lots of TSLA at ₹195.00", amount: 1560 },
              { id: "log-a4", date: "2025-04-10T15:20:00.000Z", type: "BUY", text: "Acquired 30 lots of INFY at ₹1420.00", amount: 42600 }
            ]
          }
        ];

        function App() {
          const [profiles, setProfiles] = useState(() => {
            const cached = localStorage.getItem('AURA_WEALTH_PROFILES');
            return cached ? JSON.parse(cached) : DefaultProfiles;
          });

          const [activeProfileId, setActiveProfileId] = useState(() => {
            const cachedActive = localStorage.getItem('AURA_WEALTH_ACTIVE_ID');
            if (cachedActive && cachedActive !== "undefined") return cachedActive;
            return DefaultProfiles[0].id;
          });

          const [theme, setTheme] = useState(() => {
            const cachedTheme = localStorage.getItem('AURA_THEME');
            return cachedTheme ? cachedTheme : 'dark';
          });

          // Custom user-provided API key from local storage (handles downloaded offline usage)
          const [customApiKey, setCustomApiKey] = useState(() => {
            return localStorage.getItem('AURA_GEMINI_API_KEY') || "";
          });

          const [searchGrounding, setSearchGrounding] = useState(() => {
            const cached = localStorage.getItem('AURA_GEMINI_SEARCH_GROUNDING');
            return cached !== "false"; // Default to true
          });

          const [viewState, setViewState] = useState('DASHBOARD'); // 'DASHBOARD' or 'PROFILES_SELECTOR'
          const [apiLogs, setApiLogs] = useState([]);
          const [showAddStockModal, setShowAddStockModal] = useState(false);
          const [showEditStockModal, setShowEditStockModal] = useState(false);
          const [showSellStockModal, setShowSellStockModal] = useState(false);
          const [showProfileCreateModal, setShowProfileCreateModal] = useState(false);
          const [showImportExportModal, setShowImportExportModal] = useState(false);
          const [showApiSettingsModal, setShowApiSettingsModal] = useState(false);
          const [showDebugConsole, setShowDebugConsole] = useState(false);
          
          const [isRefreshing, setIsRefreshing] = useState(false);
          const [refreshProgress, setRefreshProgress] = useState("");
          const [selectedHoldingForSell, setSelectedHoldingForSell] = useState(null);
          const [selectedHoldingForEdit, setSelectedHoldingForEdit] = useState(null);
          const [showApiErrorModal, setShowApiErrorModal] = useState(false);
          const [apiErrorMessage, setApiErrorMessage] = useState("");
          const [importJsonText, setImportJsonText] = useState("");

          const [toast, setToast] = useState(null);
          const showToast = (message, type = 'success') => {
            setToast({ message, type });
            setTimeout(() => setToast(null), 4000);
          };

          /* Cache synchronization */
          useEffect(() => {
            localStorage.setItem('AURA_WEALTH_PROFILES', JSON.stringify(profiles));
          }, [profiles]);

          useEffect(() => {
            localStorage.setItem('AURA_WEALTH_ACTIVE_ID', activeProfileId);
          }, [activeProfileId]);

          useEffect(() => {
            localStorage.setItem('AURA_THEME', theme);
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
          }, [theme]);

          useEffect(() => {
            localStorage.setItem('AURA_GEMINI_API_KEY', customApiKey);
          }, [customApiKey]);

          useEffect(() => {
            localStorage.setItem('AURA_GEMINI_SEARCH_GROUNDING', searchGrounding ? "true" : "false");
          }, [searchGrounding]);

          const activeProfile = useMemo(() => {
            return profiles.find(p => p.id === activeProfileId) || profiles[0] || null;
          }, [profiles, activeProfileId]);

          // Search autocomplete hookups
          const [searchQuery, setSearchQuery] = useState("");
          const [suggestions, setSuggestions] = useState([]);
          const [selectedStock, setSelectedStock] = useState(null);

          // Auto-complete form states
          const [buyPrice, setBuyPrice] = useState("");
          const [buyQty, setBuyQty] = useState("");
          const [buyDate, setBuyDate] = useState(() => new Date().toISOString().split('T')[0]);
          const [gttTrigger, setGttTrigger] = useState("");
          const [customGttPercent, setCustomGttPercent] = useState("");

          // Editing state structures
          const [editingGtt, setEditingGtt] = useState("");
          const [editingLots, setEditingLots] = useState([]);
          const [editCustomGttPercent, setEditCustomGttPercent] = useState("");

          // Sell form states
          const [sellPrice, setSellPrice] = useState("");
          const [sellQty, setSellQty] = useState("");
          const [sellDate, setSellDate] = useState(() => new Date().toISOString().split('T')[0]);

          // Profile builder states
          const [newProfileName, setNewProfileName] = useState("");

          const handlePercentGttApply = (percent, priceBasis, isEditMode = false) => {
            const priceVal = parseFloat(priceBasis);
            if (isNaN(priceVal) || priceVal <= 0) {
              showToast("Please specify a valid buy price first", "error");
              return;
            }
            const calculated = (priceVal * (1 + percent / 100)).toFixed(2);
            if (isEditMode) {
              setEditingGtt(calculated);
            } else {
              setGttTrigger(calculated);
            }
          };

          /* Autocomplete search debouncing effect */
          useEffect(() => {
            if (searchQuery.trim().length < 2) {
              setSuggestions([]);
              return;
            }

            const handler = setTimeout(() => {
              const filtered = StockRegistry.filter(s =>
                s.symbol.toLowerCase().includes(searchQuery.toLowerCase()) ||
                s.name.toLowerCase().includes(searchQuery.toLowerCase())
              );
              setSuggestions(filtered);
            }, 300);

            return () => clearTimeout(handler);
          }, [searchQuery]);

          const fetchMarketPrices = async (tickers) => {
            if (tickers.length === 0) return {};
            
            const timestamp = new Date().toLocaleTimeString();
            addConsoleLog(`[${timestamp}] Initiating Gemini Grounded Live Market query: ${tickers.join(', ')}`);
            setRefreshProgress("Initializing secure connection to Gemini API...");

            // Strictly preserve standard empty key setting line for automated execution environments
            const apiKey = ""; 

            // Resolve custom key or runtime environment key
            const resolvedKey = customApiKey.trim() || apiKey;

            if (!resolvedKey) {
              throw new Error("No Gemini API Key found. To fetch live market details on a downloaded app, click the 'API Configuration' button in the top header and enter your free Gemini API Key from Google AI Studio.");
            }

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${resolvedKey}`;

            const systemPrompt = "You are a professional stock valuation parser. Search live data for NSE, BSE, NASDAQ, and NYSE ticker symbols. Output ONLY raw JSON. No markdown backticks, no text wrappers.";
            const userQuery = `Search current live trading price (price) and previous day's close price (prevClose) for these tickers: ${tickers.join(', ')}. Format your response as a valid, parsable raw JSON object with this exact schema:
            {
              "SYMBOL": {
                "price": 2450.50,
                "prevClose": 2420.00
              }
            }`;

            const payload = {
              contents: [{ parts: [{ text: userQuery }] }],
              systemInstruction: {
                parts: [{ text: systemPrompt }]
              },
              generationConfig: {
                responseMimeType: "application/json"
              }
            };

            // Conditionally append search grounding tool if user has it enabled (can be disabled to bypass 403 blocks)
            if (searchGrounding) {
              payload.tools = [{ "google_search": {} }];
            }

            try {
              setRefreshProgress(searchGrounding ? "Interrogating live Google Search nodes..." : "Directly querying Gemini Model...");
              const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });

              if (!response.ok) {
                if (response.status === 403) {
                  throw new Error("HTTP network error code 403 (Forbidden). This usually happens when running locally without a custom API Key, or if your API Key lacks Search Grounding access. Try turning off 'Google Search Grounding' in API Settings.");
                }
                throw new Error(`HTTP network error code ${response.status}`);
              }

              setRefreshProgress("Deserializing Gemini responses...");
              const result = await response.json();
              const textOutput = result.candidates?.[0]?.content?.parts?.[0]?.text;

              if (!textOutput) {
                throw new Error("Empty candidate payload returned from Gemini data gateway.");
              }

              addConsoleLog(`[${new Date().toLocaleTimeString()}] Raw Gemini Payload`, textOutput);
              return JSON.parse(textOutput.trim());

            } catch (err) {
              addConsoleLog(`[${new Date().toLocaleTimeString()}] Live connection failed.`, err.message);
              throw err;
            }
          };

          const handleManualRefresh = async () => {
            if (!activeProfile || Object.keys(activeProfile.holdings).length === 0) {
              showToast("No active positions to query.", "error");
              return;
            }

            setIsRefreshing(true);
            const tickers = Object.keys(activeProfile.holdings);
            
            try {
              const marketQuotes = await fetchMarketPrices(tickers);
              
              setProfiles(prevProfiles => {
                return prevProfiles.map(p => {
                  if (p.id !== activeProfileId) return p;

                  const updatedHoldings = { ...p.holdings };
                  let updatedCount = 0;

                  tickers.forEach(symbol => {
                    const quote = marketQuotes[symbol] || marketQuotes[symbol.toUpperCase()];
                    if (quote && quote.price) {
                      updatedHoldings[symbol] = {
                        ...updatedHoldings[symbol],
                        price: Number(quote.price),
                        prevClose: quote.prevClose ? Number(quote.prevClose) : Number(quote.price * 0.98),
                      };
                      updatedCount++;
                    }
                  });

                  const newLog = {
                    id: generateId(),
                    date: new Date().toISOString(),
                    type: "SYSTEM",
                    text: `Synchronized market updates: Tracked ${updatedCount}/${tickers.length} tickers successfully via Gemini Grounding.`,
                  };

                  return {
                    ...p,
                    holdings: updatedHoldings,
                    synced: true,
                    logs: [newLog, ...p.logs]
                  };
                });
              });

              showToast("All live asset prices successfully loaded!", "success");
            } catch (error) {
              console.error(error);
              setApiErrorMessage(error.message || "Failed to establish real-time socket with Gemini API. Please retry or run simulator mode.");
              setShowApiErrorModal(true);
            } finally {
              setIsRefreshing(false);
              setRefreshProgress("");
            }
          };

          /* Fallback Simulation Handler */
          const handleOfflineSimulatorBypass = () => {
            if (!activeProfile) return;
            setIsRefreshing(true);
            setRefreshProgress("Simulating live quotes mapping...");

            setTimeout(() => {
              setProfiles(prevProfiles => {
                return prevProfiles.map(p => {
                  if (p.id !== activeProfileId) return p;

                  const updatedHoldings = { ...p.holdings };
                  Object.keys(updatedHoldings).forEach(symbol => {
                    const lots = updatedHoldings[symbol].buyLots;
                    const avgCost = lots.reduce((acc, lot) => acc + lot.price, 0) / (lots.length || 1);
                    const currentPrice = Number((avgCost * (1 + (Math.random() * 0.25 - 0.08))).toFixed(2));
                    const prevClose = Number((currentPrice * (1 + (Math.random() * 0.04 - 0.02))).toFixed(2));

                    updatedHoldings[symbol] = {
                      ...updatedHoldings[symbol],
                      price: currentPrice,
                      prevClose: prevClose
                    };
                  });

                  const newLog = {
                    id: generateId(),
                    date: new Date().toISOString(),
                    type: "SYSTEM",
                    text: "Prices successfully updated via Offline Simulation bypass."
                  };

                  return {
                    ...p,
                    holdings: updatedHoldings,
                    synced: true,
                    logs: [newLog, ...p.logs]
                  };
                });
              });

              setIsRefreshing(false);
              setRefreshProgress("");
              setShowApiErrorModal(false);
              showToast("Simulation Complete! Local valuations populated.", "success");
            }, 1000);
          };

          const addConsoleLog = (title, message = "") => {
            setApiLogs(prev => [
              { id: generateId(), title, message: typeof message === 'object' ? JSON.stringify(message, null, 2) : message },
              ...prev
            ]);
          };

          const metrics = useMemo(() => {
            if (!activeProfile) {
              return { activeHoldingsCount: 0, totalCostBasis: 0, totalCurrentValue: 0, absolutePnL: 0, percentPnL: 0, isSynced: false };
            }

            let activeHoldingsCount = 0;
            let totalCostBasis = 0;
            let totalCurrentValue = 0;
            let isSynced = activeProfile.synced;

            Object.values(activeProfile.holdings).forEach(holding => {
              const activeQty = holding.buyLots.reduce((acc, l) => acc + l.qty, 0);
              if (activeQty > 0) {
                activeHoldingsCount++;
                const costBasis = holding.buyLots.reduce((acc, l) => acc + (l.qty * l.price), 0);
                totalCostBasis += costBasis;

                if (isSynced && holding.price !== null) {
                  totalCurrentValue += (activeQty * holding.price);
                }
              }
            });

            const absolutePnL = totalCurrentValue - totalCostBasis;
            const percentPnL = totalCostBasis > 0 ? (absolutePnL / totalCostBasis) * 100 : 0;

            return {
              activeHoldingsCount,
              totalCostBasis,
              totalCurrentValue: isSynced ? totalCurrentValue : null,
              absolutePnL,
              percentPnL,
              isSynced
            };
          }, [activeProfile]);

          const handleOpenEditModal = (ticker) => {
            const holding = activeProfile.holdings[ticker];
            if (!holding) return;
            setSelectedHoldingForEdit(ticker);
            setEditingGtt(holding.gttPrice !== null ? holding.gttPrice.toString() : "");
            setEditingLots(holding.buyLots.map(lot => ({ ...lot })));
            setEditCustomGttPercent("");
            setShowEditStockModal(true);
          };

          const handleEditLotChange = (id, field, value) => {
            setEditingLots(prev =>
              prev.map(lot => (lot.id === id ? { ...lot, [field]: value } : lot))
            );
          };

          const handleDeleteEditLot = (id) => {
            setEditingLots(prev => prev.filter(lot => lot.id !== id));
          };

          const handleAddEditLot = () => {
            const newLot = {
              id: generateId(),
              date: new Date().toISOString().split('T')[0],
              price: 0,
              qty: 0
            };
            setEditingLots(prev => [...prev, newLot]);
          };

          const saveEditedStock = (e) => {
            e.preventDefault();
            if (!selectedHoldingForEdit) return;

            // Validate edit lots
            const cleanedLots = editingLots.map(lot => ({
              ...lot,
              price: parseFloat(lot.price),
              qty: parseInt(lot.qty, 10)
            })).filter(lot => !isNaN(lot.price) && lot.price > 0 && !isNaN(lot.qty) && lot.qty > 0);

            const gttVal = editingGtt.trim() !== "" ? parseFloat(editingGtt) : null;

            setProfiles(prevProfiles => {
              return prevProfiles.map(p => {
                if (p.id !== activeProfileId) return p;

                const updatedHoldings = { ...p.holdings };
                if (cleanedLots.length === 0) {
                  // If no lots remain, clean out the asset fully
                  delete updatedHoldings[selectedHoldingForEdit];
                } else {
                  updatedHoldings[selectedHoldingForEdit] = {
                    ...updatedHoldings[selectedHoldingForEdit],
                    buyLots: cleanedLots,
                    gttPrice: gttVal
                  };
                }

                const newLog = {
                  id: generateId(),
                  date: new Date().toISOString(),
                  type: "SYSTEM",
                  text: `Updated structure/GTT rules for ${selectedHoldingForEdit} manually.`
                };

                return {
                  ...p,
                  holdings: updatedHoldings,
                  logs: [newLog, ...p.logs],
                  synced: false // clear synced state on edit to prevent layout shifts
                };
              });
            });

            setShowEditStockModal(false);
            setSelectedHoldingForEdit(null);
            showToast(`Configurations updated for ${selectedHoldingForEdit}!`, "success");
          };

          const executeFifoSell = (e) => {
            e.preventDefault();
            if (!selectedHoldingForSell) return;

            const qtyToSell = parseInt(sellQty, 10);
            const pricePerShare = parseFloat(sellPrice);
            const sellDateStr = sellDate;

            if (qtyToSell <= 0 || isNaN(qtyToSell) || pricePerShare <= 0 || isNaN(pricePerShare)) {
              showToast("Please supply valid prices and trading quantities.", "error");
              return;
            }

            const currentHolding = activeProfile.holdings[selectedHoldingForSell];
            const totalOwnedShares = currentHolding.buyLots.reduce((acc, l) => acc + l.qty, 0);

            if (qtyToSell > totalOwnedShares) {
              showToast(`Insufficient quantity. You only possess ${totalOwnedShares} shares of ${selectedHoldingForSell}.`, "error");
              return;
            }

            setProfiles(prevProfiles => {
              return prevProfiles.map(p => {
                if (p.id !== activeProfileId) return p;

                const updatedHoldings = { ...p.holdings };
                const originalLots = [...updatedHoldings[selectedHoldingForSell].buyLots];
                originalLots.sort((a, b) => new Date(a.date) - new Date(b.date));

                let remainingSellQty = qtyToSell;
                let realizedGainLoss = 0;
                const modifiedLots = [];

                for (let lot of originalLots) {
                  if (remainingSellQty <= 0) {
                    modifiedLots.push(lot);
                    continue;
                  }

                  if (lot.qty <= remainingSellQty) {
                    realizedGainLoss += (pricePerShare - lot.price) * lot.qty;
                    remainingSellQty -= lot.qty;
                  } else {
                    realizedGainLoss += (pricePerShare - lot.price) * remainingSellQty;
                    modifiedLots.push({
                      ...lot,
                      qty: lot.qty - remainingSellQty
                    });
                    remainingSellQty = 0;
                  }
                }

                const activeRemainingQty = modifiedLots.reduce((acc, l) => acc + l.qty, 0);

                if (activeRemainingQty === 0) {
                  delete updatedHoldings[selectedHoldingForSell];
                } else {
                  updatedHoldings[selectedHoldingForSell] = {
                    ...updatedHoldings[selectedHoldingForSell],
                    buyLots: modifiedLots
                  };
                }

                const newLog = {
                  id: generateId(),
                  date: new Date(sellDateStr).toISOString(),
                  type: "SELL",
                  text: `Sold ${qtyToSell} shares of ${selectedHoldingForSell} at ₹${pricePerShare.toFixed(2)} using FIFO (Gain: ₹${realizedGainLoss.toFixed(2)}).`,
                  amount: qtyToSell * pricePerShare
                };

                return {
                  ...p,
                  realizedPnL: p.realizedPnL + realizedGainLoss,
                  holdings: updatedHoldings,
                  logs: [newLog, ...p.logs]
                };
              });
            });

            setShowSellStockModal(false);

            setSellQty("");
            setSellPrice("");

                    <div className={`px-6 py-5 border-b flex items-center gap-3 ${themeStyles.cardHeader}`}>
                      <div className="w-8 h-8 rounded-lg bg-amber-500/10 border border-amber-500/35 flex items-center justify-center text-amber-500">
                        <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                      </div>
                      <div>
                        <h4 className="font-extrabold text-sm tracking-tight uppercase">API Gateway Exception (403 / Local Override)</h4>
                        <p className="text-[10px] uppercase tracking-widest font-semibold opacity-60 font-mono">Authentication Required or Google Search Grounding Restricted</p>
                      </div>
                    </div>

                    <div className="p-6 space-y-4">
                      <p className="text-xs opacity-65 leading-relaxed">
                        Your downloaded app is currently unable to communicate with Google's servers. Supply a free Gemini API key to enable live price extraction:
                      </p>

                      {/* Integrated instant API config inside the error view */}
                      <div className="space-y-3 p-4 bg-slate-500/10 rounded-xl border border-slate-300/40">
                        <div className="space-y-1">
                          <label className="text-[10px] font-bold uppercase tracking-wider opacity-85 block text-amber-500">Paste your Gemini API Key</label>
                          <input
                            type="password"
                            placeholder="AIzaSy..."
                            value={customApiKey}
                            onChange={(e) => setCustomApiKey(e.target.value)}
                            className={`w-full rounded-lg px-3 py-2 text-xs font-mono focus:outline-none ${themeStyles.input}`}
                          />
                        </div>

                        <div className="flex items-center justify-between pt-1">
                          <span className="text-[10px] uppercase font-bold opacity-75">Enable Search Grounding</span>
                          <button
                            type="button"
                            onClick={() => setSearchGrounding(!searchGrounding)}
                            className={`w-10 h-5 rounded-full transition-colors relative flex items-center p-0.5 ${
                              searchGrounding ? "bg-emerald-500" : "bg-slate-300"
                            }`}
                          >
                            <span className={`w-4 h-4 bg-white rounded-full shadow transform transition-transform ${
                              searchGrounding ? "translate-x-5" : "translate-x-0"
                            }`} />
                          </button>
                        </div>
                      </div>

                      <div className="bg-slate-900 p-3 rounded-lg border border-slate-800 font-mono text-[10px] text-rose-400 whitespace-pre-wrap max-h-24 overflow-y-auto">
                        {apiErrorMessage}
                      </div>

                      <div className="border-t border-slate-200/50 pt-4 flex flex-col gap-2">
                        <button
                          type="button"
                          onClick={() => {
                            setShowApiErrorModal(false);
                            handleManualRefresh();
                          }}
                          className="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-sm"
                        >
                          Retry with new settings
                        </button>
                        <button
                          type="button"
                          onClick={handleOfflineSimulatorBypass}
                          className="w-full bg-[#22c55e] hover:bg-[#1ebd54] text-white font-bold py-2.5 rounded-xl text-xs transition shadow-sm"
                        >
                          Bypass Sync (Use Offline Simulator Quotes)
                        </button>
                        <button
                          type="button"
                          onClick={() => setShowApiErrorModal(false)}
                          className="w-full bg-slate-100 border border-slate-300 hover:bg-slate-200 text-slate-800 text-xs font-bold py-2.5 rounded-xl transition"
                        >
                          Dismiss Error Console
                        </button>
                      </div>
                    </div>

                  </div>
                </div>
              )}

              {/* Footer attribution */}
              <footer className="border-t py-6 px-6 text-center mt-auto border-slate-200 bg-transparent opacity-80 text-xs font-semibold tracking-wide">
                <p>Developed by Arjun Gupta, IRMS (Accounts) 2023 with help of Gemini AI</p>
              </footer>

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
