        // Format Date to legible string
        function formatDateString(dateStr) {
          if (!dateStr) return "N/A";
          const dateObj = new Date(dateStr);
          if (isNaN(dateObj.getTime())) return dateStr;
          const day = String(dateObj.getDate()).padStart(2, '0');
          const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
          return `${day}-${months[dateObj.getMonth()]}-${dateObj.getFullYear()}`;
        }

        // Calculates exact holding period relative to current simulated date of May 24, 2026
        function getHoldingDuration(dateStr) {
          if (!dateStr) return "N/A";
          const startDate = new Date(dateStr);
          const endDate = new Date("2026-05-24"); // May 24, 2026 Context
          if (isNaN(startDate.getTime())) return "N/A";
          
          let years = endDate.getFullYear() - startDate.getFullYear();
          let months = endDate.getMonth() - startDate.getMonth();
          let days = endDate.getDate() - startDate.getDate();
          
          if (days < 0) {
            months -= 1;
            const prevMonth = new Date(endDate.getFullYear(), endDate.getMonth(), 0);
            days += prevMonth.getDate();
          }
          if (months < 0) {
            years -= 1;
            months += 12;
          }
          
          const parts = [];
          if (years > 0) parts.push(`${years}y`);
          if (months > 0) parts.push(`${months}m`);
          if (days > 0 && years === 0 && months === 0) parts.push(`${days}d`);
          
          if (parts.length === 0) return "Today";
          return parts.join(" ");
        }

        // Formats currency to rounded integer INR standard
        function formatINR(number, roundToInteger = true) {
          if (number === null || number === undefined || isNaN(number)) return "₹0";
          const val = roundToInteger ? Math.round(number) : number;
          return new Intl.NumberFormat('en-IN', {
            style: 'currency',
            currency: 'INR',
            maximumFractionDigits: roundToInteger ? 0 : 2
          }).format(val);
        }

        // Formats percentages rounded to nearest integer or 0.5% boundary
        // Using standard LaTeX math formulas formatting internally for operations representation
        function formatPercent(value) {
          if (value === null || value === undefined || isNaN(value)) return "0%";
          const rounded = Math.round(value * 2) / 2;
          const sign = rounded > 0 ? '+' : '';
          const decimals = rounded % 1 === 0 ? 0 : 1;
          return `${sign}${rounded.toFixed(decimals)}%`;
        }

              if (!activeProfile || !activeProfile.lastRefreshed) {

              const lastRef = new Date(activeProfile.lastRefreshed);

              if (diffSecs < 10) {
                setSyncRelativeTimeText("Synced just now");
              } else if (diffSecs < 60) {
                setSyncRelativeTimeText(`Synced ${diffSecs}s ago`);
              } else {
                const diffMins = Math.floor(diffSecs / 60);
                if (diffMins < 60) {
                  setSyncRelativeTimeText(`Synced ${diffMins}m ago`);
                } else {
                  const diffHours = Math.floor(diffMins / 60);
                  setSyncRelativeTimeText(`Synced ${diffHours}h ${diffMins % 60}m ago`);

            };

            calculateRelativeTime();
            const interval = setInterval(calculateRelativeTime, 10000);

          const handlePercentGttApply = (percent, priceBasis, isEditMode = false) => {
            const priceVal = parseFloat(priceBasis);
            if (isNaN(priceVal) || priceVal <= 0) {

          useEffect(() => {
            if (searchQuery.trim().length < 2) {

              return;

            const handler = setTimeout(() => {
              const filtered = StockRegistry.filter(s =>
                s.symbol.toLowerCase().includes(searchQuery.toLowerCase()) ||

              );
              setSuggestions(filtered);
            }, 300);

            return () => clearTimeout(handler);
          }, [searchQuery]);

          // RAPIDAPI Stock Market Provider Integration Module
          const fetchMarketPrices = async (tickers) => {
            if (tickers.length === 0) return {};
            
            const timestamp = new Date().toLocaleTimeString();
            addConsoleLog(`[${timestamp}] Initiating RapidAPI Quotes Query for: ${tickers.join(', ')}`);
            setRefreshProgress("Initializing secure connection to RapidAPI gateway...");

            // Resolve RapidAPI key from constant first, fallback to user input
            const resolvedKey = (typeof API_KEY !== 'undefined' && API_KEY !== 'PLACEHOLDER' && API_KEY.trim() !== '') 
              ? API_KEY.trim() 
              : customApiKey.trim();

            if (!resolvedKey) {
              throw new Error("API Connection Key is missing. Please configure it inside the HTML script constants or directly via 'API Config' drawer.");
            }

            // Map tickers to correct schemas (appending ".NS" for Indian National Stock Exchange equities)
            const formattedSymbols = tickers.map(ticker => {
              const upperTicker = ticker.toUpperCase();
              const registryMatch = StockRegistry.find(s => s.symbol.toUpperCase() === upperTicker);
              // If it's explicitly NASDAQ in registry, don't append .NS
              if (registryMatch && registryMatch.exchange === "NASDAQ") {
                return upperTicker;
              }
              // If it doesn't already have .NS and it's not NASDAQ, append .NS
              if (!upperTicker.endsWith('.NS')) {
                return `${upperTicker}.NS`;
              }
              return upperTicker;
            });

            const symbolsParam = formattedSymbols.join(",");
            const apiUrl = `https://yh-finance.p.rapidapi.com/market/v2/get-quotes?region=IN&symbols=${symbolsParam}`;

            try {
              setRefreshProgress("Requesting single-credit batch market quotes...");
              const response = await fetch(apiUrl, {
                method: "GET",
                headers: {
                  "x-rapidapi-host": "yh-finance.p.rapidapi.com",
                  "x-rapidapi-key": resolvedKey
                }
              });

              if (!response.ok) {
                throw new Error(`RapidAPI Server Exception. Connection returned HTTP Status Code: ${response.status}`);
              }

              const data = await response.json();

              if (!data.quoteResponse || !data.quoteResponse.result) {
                throw new Error("Unexpected payload structure returned from Yahoo Finance API engine.");
              }

              addConsoleLog(`[${new Date().toLocaleTimeString()}] Live RapidAPI Batch Quote Payload Trace`, JSON.stringify(data, null, 2));

              const normalizedQuotes = {};

              data.quoteResponse.result.forEach(item => {
                if (!item || !item.symbol) return;
                const itemSymbol = item.symbol.toUpperCase();

                tickers.forEach(ticker => {
                  const upperTicker = ticker.toUpperCase();
                  const registryMatch = StockRegistry.find(s => s.symbol.toUpperCase() === upperTicker);
                  let expectedApiSymbol = upperTicker;
                  
                  if (registryMatch && registryMatch.exchange === "NASDAQ") {
                    expectedApiSymbol = upperTicker;
                  } else if (!upperTicker.endsWith('.NS')) {
                    expectedApiSymbol = `${upperTicker}.NS`;
                  }

                  // Perform match against both raw symbol and expected suffixed symbol safely
                  if (itemSymbol === expectedApiSymbol || itemSymbol === upperTicker) {
                    const price = parseFloat(item.regularMarketPrice !== undefined ? item.regularMarketPrice : item.currentPrice);
                    const prevClose = parseFloat(item.regularMarketPreviousClose !== undefined ? item.regularMarketPreviousClose : item.previousClose);

                    if (!isNaN(price)) {
                      normalizedQuotes[upperTicker] = {
                        price: price,
                        prevClose: isNaN(prevClose) ? price * 0.98 : prevClose
                      };
                    }
                  }
                });
              });

              return normalizedQuotes;

            } catch (err) {
              addConsoleLog(`[${new Date().toLocaleTimeString()}] RapidAPI Transaction Failure`, err.message);
              throw err;
            }
          };

          const handleManualRefresh = async () => {
            if (!activeProfile || Object.keys(activeProfile.holdings).length === 0) {
              showToast("No active positions to synchronize.", "error");
              return;
            }

            setIsRefreshing(true);
            const tickers = Object.keys(activeProfile.holdings);
            
            try {
              const marketQuotes = await fetchMarketPrices(tickers);
              
              setProfiles(prevProfiles => {
                return prevProfiles.map(p => {
                  if (p.id !== activeProfileId) return p;

                  const updatedHoldings = { ...p.holdings };
                  let updatedCount = 0;

                  tickers.forEach(symbol => {
                    const quote = marketQuotes[symbol] || marketQuotes[symbol.toUpperCase()];
                    if (quote && quote.price) {
                      updatedHoldings[symbol] = {
                        ...updatedHoldings[symbol],
                        price: Number(quote.price),
                        prevClose: quote.prevClose ? Number(quote.prevClose) : Number(quote.price * 0.98),
                      };
                      updatedCount++;
                    }
                  });

                  const newLog = {
                    id: generateId(),
                    date: new Date().toISOString(),
                    type: "SYSTEM",
                    text: `Synchronized market data: ${updatedCount}/${tickers.length} tickers updated under single RapidAPI credit usage.`,
                  };

                  return {
                    ...p,
                    holdings: updatedHoldings,
                    synced: true,
                    lastRefreshed: new Date().toISOString(),
                    logs: [newLog, ...p.logs]
                  };
                });
              });

              showToast("Quotes updated via RapidAPI batch integration!", "success");

              setApiErrorMessage(error.message || "Failed to establish synchronization with RapidAPI.");
              setShowApiErrorModal(true);
            } finally {

            }
          };

          const handleOfflineSimulatorBypass = () => {
            if (!activeProfile) return;
            setIsRefreshing(true);
            setRefreshProgress("Simulating live quotes mapping...");

            setTimeout(() => {
              setProfiles(prevProfiles => {
                return prevProfiles.map(p => {
                  if (p.id !== activeProfileId) return p;

                  const updatedHoldings = { ...p.holdings };
                  Object.keys(updatedHoldings).forEach(symbol => {

                    const avgCost = lots.reduce((acc, lot) => acc + lot.price, 0) / (lots.length || 1);
                    const currentPrice = Number((avgCost * (1 + (Math.random() * 0.25 - 0.08))).toFixed(2));
                    const prevClose = Number((currentPrice * (1 + (Math.random() * 0.04 - 0.02))).toFixed(2));

                    updatedHoldings[symbol] = {
                      ...updatedHoldings[symbol],
                      price: currentPrice,
                      prevClose: prevClose
                    };
                  });

                  const newLog = {
                    id: generateId(),
                    date: new Date().toISOString(),
                    type: "SYSTEM",
                    text: "Prices updated successfully via Simulated Local Engine."
                  };

                  return {
                    ...p,
                    holdings: updatedHoldings,
                    synced: true,
                    lastRefreshed: new Date().toISOString(),
                    logs: [newLog, ...p.logs]
                  };
                });
              });

              setIsRefreshing(false);
              setRefreshProgress("");
              setShowApiErrorModal(false);
              showToast("Simulation complete. Offline prices generated.", "success");
            }, 1000);
          };

          const addConsoleLog = (title, message = "") => {
            setApiLogs(prev => [
              { id: generateId(), title, message: typeof message === 'object' ? JSON.stringify(message, null, 2) : message },
              ...prev
            ]);
          };

          // Metrics calculations (all currency output calculations formatted elegantly)
          const metrics = useMemo(() => {
            if (!activeProfile) {
              return { activeHoldingsCount: 0, totalCostBasis: 0, totalCurrentValue: 0, absolutePnL: 0, percentPnL: 0, isSynced: false };
            }

            let activeHoldingsCount = 0;
            let totalCostBasis = 0;
            let totalCurrentValue = 0;
            let isSynced = activeProfile.synced;

            Object.values(activeProfile.holdings).forEach(holding => {
              const activeQty = holding.buyLots.reduce((acc, l) => acc + l.qty, 0);
              if (activeQty > 0) {
                activeHoldingsCount++;
                const costBasis = holding.buyLots.reduce((acc, l) => acc + (l.qty * l.price), 0);
                totalCostBasis += costBasis;

                if (isSynced && holding.price !== null) {
                  totalCurrentValue += (activeQty * holding.price);
                }
              }
            });

            const absolutePnL = totalCurrentValue - totalCostBasis;
            const percentPnL = totalCostBasis > 0 ? (absolutePnL / totalCostBasis) * 100 : 0;

            return {
              activeHoldingsCount,
              totalCostBasis,
              totalCurrentValue: isSynced ? totalCurrentValue : null,
              absolutePnL,
              percentPnL,

            };
          }, [activeProfile]);

          // Parses realized sales list out of SELL transactions
          const realizedSales = useMemo(() => {
            if (!activeProfile) return [];
            const salesMap = {};
            
            const sellLogs = [...activeProfile.logs]
              .filter(log => log.type === "SELL")
              .reverse();

            sellLogs.forEach(log => {
              let ticker = "";
              let gainLoss = 0;
              let volume = log.amount || 0;

              if (log.revertStockState) {
                ticker = log.revertStockState.ticker;
                gainLoss = log.revertStockState.realizedPnLDiff || 0;
              } else {
                const tickerMatch = log.text.match(/shares of ([A-Z0-9]+)/i);
                if (tickerMatch) ticker = tickerMatch[1].toUpperCase();

                const gainMatch = log.text.match(/Gain:\s*₹?(-?\d+\.?\d*)/i);
                if (gainMatch) {
                  gainLoss = parseFloat(gainMatch[1]);
                }
              }

              if (ticker) {
                if (!salesMap[ticker]) {
                  salesMap[ticker] = {
                    ticker,
                    realizedPnL: 0,
                    totalVolume: 0,
                    salesCount: 0
                  };
                }
                salesMap[ticker].realizedPnL += gainLoss;
                salesMap[ticker].totalVolume += volume;

          const handleOpenEditModal = (ticker) => {

          // Strict chronological First-In First-Out (FIFO) Liquidation Engine
          const executeFifoSell = (e) => {
            e.preventDefault();
            if (!selectedHoldingForSell) return;

            const qtyToSell = parseInt(sellQty, 10);
            const pricePerShare = parseFloat(sellPrice);
            const sellDateStr = sellDate;

            if (qtyToSell <= 0 || isNaN(qtyToSell) || pricePerShare <= 0 || isNaN(pricePerShare)) {
              showToast("Please input valid trade metrics.", "error");
              return;
            }

            const currentHolding = activeProfile.holdings[selectedHoldingForSell];
            const totalOwnedShares = currentHolding.buyLots.reduce((acc, l) => acc + l.qty, 0);

            if (qtyToSell > totalOwnedShares) {
              showToast(`Insufficient quantity. You hold ${totalOwnedShares} shares of ${selectedHoldingForSell}.`, "error");
              return;
            }

            const originalBuyLotsBeforeSale = currentHolding.buyLots.map(lot => ({ ...lot }));

            setProfiles(prevProfiles => {
              return prevProfiles.map(p => {
                if (p.id !== activeProfileId) return p;

                const updatedHoldings = { ...p.holdings };
                const originalLots = [...updatedHoldings[selectedHoldingForSell].buyLots];
                originalLots.sort((a, b) => new Date(a.date) - new Date(b.date));

                let remainingSellQty = qtyToSell;
                let realizedGainLoss = 0;
                const modifiedLots = [];

                for (let lot of originalLots) {
                  if (remainingSellQty <= 0) {
                    modifiedLots.push(lot);
                    continue;
                  }

                  if (lot.qty <= remainingSellQty) {
                    realizedGainLoss += (pricePerShare - lot.price) * lot.qty;
                    remainingSellQty -= lot.qty;
                  } else {
                    realizedGainLoss += (pricePerShare - lot.price) * remainingSellQty;
                    modifiedLots.push({
                      ...lot,
                      qty: lot.qty - remainingSellQty
                    });
                    remainingSellQty = 0;
                  }
                }

                const activeRemainingQty = modifiedLots.reduce((acc, l) => acc + l.qty, 0);

                const originalPrice = updatedHoldings[selectedHoldingForSell].price;
                const originalPrevClose = updatedHoldings[selectedHoldingForSell].prevClose;
                const originalGttPrice = updatedHoldings[selectedHoldingForSell].gttPrice;

                if (activeRemainingQty === 0) {
                  delete updatedHoldings[selectedHoldingForSell];
                } else {
                  updatedHoldings[selectedHoldingForSell] = {
                    ...updatedHoldings[selectedHoldingForSell],
                    buyLots: modifiedLots
                  };

                const newLog = {
                  id: generateId(),
                  date: new Date(sellDateStr).toISOString(),
                  type: "SELL",
                  text: `Executed FIFO Sell: Sold ${qtyToSell} shares of ${selectedHoldingForSell} at ₹${pricePerShare.toFixed(2)} (Gain: ₹${realizedGainLoss.toFixed(2)}).`,
                  amount: qtyToSell * pricePerShare,
                  revertStockState: {
                    ticker: selectedHoldingForSell,
                    buyLots: originalBuyLotsBeforeSale,
                    realizedPnLDiff: realizedGainLoss,
                    price: originalPrice,
                    prevClose: originalPrevClose,
                    gttPrice: originalGttPrice
                  }
                };

                return {
                  ...p,
                  realizedPnL: p.realizedPnL + realizedGainLoss,
                  holdings: updatedHoldings,
                  logs: [newLog, ...p.logs]
                };
              });
            });

                  if (logToDelete.type === "SELL") {
                    updatedRealizedPnL = updatedRealizedPnL - (realizedPnLDiff || 0);
                    
                    if (buyLots) {

                          gttPrice: updatedHoldings[ticker].gttPrice !== null ? updatedHoldings[ticker].gttPrice : (gttPrice !== undefined ? gttPrice : null)
                        };
                      }
                    }
                  } else if (logToDelete.type === "BUY") {
                    if (updatedHoldings[ticker]) {
                      const filteredLots = updatedHoldings[ticker].buyLots.filter(l => l.id !== addedLotId);
                      if (filteredLots.length === 0) {
                        delete updatedHoldings[ticker];
                      } else {
                        updatedHoldings[ticker] = {
                          ...updatedHoldings[ticker],
                          buyLots: filteredLots
                        };

                    }
                  }

                const filteredLogs = p.logs.filter(l => l.id !== logId);

                return {

            showToast("Log deleted and transaction reversed successfully!", "info");

          // Bulk Pasted Excel/Sheets Parser
          const parseExcelDump = (text) => {
            const lines = text.split(/\r?\n/);
            const trades = [];

            lines.forEach((line) => {
              const row = line.trim();
              if (!row) return;

              let cols = row.split('\t');
              
              if (cols.length < 5) {
                const spaceSplit = row.split(/\s{2,}/);
                if (spaceSplit.length >= 5) {
                  cols = spaceSplit;
                }
              }

              const trimmedCols = cols.map(c => c.trim().replace(/^"(.*)"$/, '$1'));

              // Skip headers if found
              if (trimmedCols[0].toLowerCase().includes("company") || trimmedCols[1]?.toLowerCase() === "symbol") {
                return;
              }

              const companyName = trimmedCols[0];
              const symbol = trimmedCols[1]?.toUpperCase();
              const isin = trimmedCols[2];
              const action = trimmedCols[3]?.toUpperCase(); // BUY or SELL
              const qty = parseInt(trimmedCols[4], 10);
              
              const totalValRaw = trimmedCols[5] ? trimmedCols[5].replace(/,/g, '') : "0";
              const totalValue = parseFloat(totalValRaw);

              const exchange = trimmedCols[6] || "NSE";
              const orderId = trimmedCols[7] || `ord-${generateId()}`;
              const rawDate = trimmedCols[8];

              if (!symbol || isNaN(qty) || isNaN(totalValue) || (action !== "BUY" && action !== "SELL")) {
                return;
              }

              const pricePerShare = qty > 0 ? (totalValue / qty) : 0;

              let parsedDate = new Date();
              if (rawDate) {
                const dateParts = rawDate.match(/^(\d{1,2})-(\d{1,2})-(\d{4})\s+(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
                if (dateParts) {
                  const day = parseInt(dateParts[1], 10);
                  const month = parseInt(dateParts[2], 10) - 1; 
                  const year = parseInt(dateParts[3], 10);
                  let hour = parseInt(dateParts[4], 10);
                  const min = parseInt(dateParts[5], 10);
                  const ampm = dateParts[6] ? dateParts[6].toUpperCase() : null;

                  if (ampm === "PM" && hour < 12) hour += 12;
                  if (ampm === "AM" && hour === 12) hour = 0;

                  parsedDate = new Date(year, month, day, hour, min, 0);
                } else {
                  const epoch = Date.parse(rawDate);
                  if (!isNaN(epoch)) {
                    parsedDate = new Date(epoch);
                  }
                }
              }

              trades.push({
                companyName,
                symbol,
                isin,
                action,
                qty,
                totalValue,
                pricePerShare,
                exchange,
                orderId,
                date: parsedDate,
                status: trimmedCols[9] || "Executed"
              });
            });

            // Sort trades chronologically to build accurate portfolio sequences
            trades.sort((a, b) => a.date - b.date);
            return trades;

                        importErrorCount++;

                      const originalLots = [...existingHolding.buyLots];
                      originalLots.sort((a, b) => new Date(a.date) - new Date(b.date));

                          });
                          remainingSellQty = 0;

                      const originalPrice = existingHolding.price;

                      const originalGttPrice = existingHolding.gttPrice;

                          required
                          value={sellDate}
                          onChange={(e) => setSellDate(e.target.value)}
                          className={`w-full rounded-xl px-4 py-2.5 text-sm focus:outline-none font-mono ${themeStyles.input}`}
                        />
                      </div>

                      <div className="pt-4 border-t border-slate-200 dark:border-slate-800 flex justify-end gap-3">
                        <button
                          type="button"
                          onClick={() => {
                            setShowSellStockModal(false);
                            setSelectedHoldingForSell(null);
                          }}
                          className="bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 hover:bg-slate-200 text-slate-800 dark:text-slate-200 text-xs font-bold py-2.5 px-5 rounded-xl transition"
                        >
                          Cancel
                        </button>
                        <button
                          type="submit"
                          className="bg-rose-500 hover:bg-rose-600 text-white text-xs font-bold py-2.5 px-6 rounded-xl transition shadow-sm"
                        >
                          Execute FIFO Sale
                        </button>
                      </div>

                    </form>
                  </div>
                </div>
              )}

              {/* Create Profile Modal */}
              {showProfileCreateModal && (
                <div className="fixed inset-0 bg-black/55 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                  <div className={`border rounded-2xl max-w-sm w-full overflow-hidden shadow-2xl animate-scale-up ${themeStyles.card}`}>
                    
                    <div className={`px-6 py-4 border-b flex justify-between items-center ${themeStyles.cardHeader}`}>
                      <h4 className="font-extrabold text-sm uppercase">New Profile Vault</h4>
                      <button
                        onClick={() => setShowProfileCreateModal(false)}
                        className="opacity-60 hover:opacity-100"
                      >
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                      </button>
                    </div>

                    <form onSubmit={handleCreateProfile} className="p-6 space-y-4">
                      <div className="space-y-1">
                        <label className="text-xs font-bold uppercase tracking-wide opacity-75">Owner Name</label>
                        <input
                          type="text"
                          required
                          placeholder="e.g. Nikita"
                          value={newProfileName}
                          onChange={(e) => setNewProfileName(e.target.value)}
                          className={`w-full rounded-xl px-4 py-2.5 text-sm font-bold focus:outline-none ${themeStyles.input}`}
                        />
                      </div>

                      <div className="pt-4 border-t border-slate-200 dark:border-slate-800 flex justify-end gap-3">
                        <button
                          type="button"
                          onClick={() => setShowProfileCreateModal(false)}
                          className="bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 hover:bg-slate-200 text-slate-800 dark:text-slate-200 text-xs font-bold py-2.5 px-4 rounded-xl transition"
                        >
                          Cancel
                        </button>
                        <button
                          type="submit"
                          className="bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold py-2.5 px-5 rounded-xl transition"
                        >
                          Provision Vault
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              )}

              {/* Import/Export Modal */}
              {showImportExportModal && (
                <div className="fixed inset-0 bg-black/55 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                  <div className={`border rounded-2xl max-w-xl w-full overflow-hidden shadow-2xl animate-scale-up ${themeStyles.card}`}>
                    
                    <div className={`px-6 py-4 border-b flex justify-between items-center ${themeStyles.cardHeader}`}>
                      <div>
                        <h4 className="font-extrabold text-base tracking-tight">Data Portability Engine</h4>
                        <p className="text-[10px] uppercase tracking-widest font-semibold opacity-60">Import or Export Your Entire Application Local Cache</p>
                      </div>
                      <button
                        onClick={() => {
                          setShowImportExportModal(false);
                          setImportJsonText("");
                        }}
                        className="opacity-60 hover:opacity-100"
                      >
                        <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                      </button>
                    </div>

                    <div className="p-6 space-y-5">
                      
                      <div className="space-y-2">
                        <h5 className="text-xs font-bold uppercase tracking-wide opacity-80">Export State Backup</h5>
                        <p className="text-xs opacity-60">Generate and download a self-contained `.json` snapshot of all created profiles, holdings lots, and trade histories.</p>
                        <button
                          type="button"
                          onClick={handleExportState}
                          className="w-full bg-[#22c55e] hover:bg-[#1ebd54] text-white font-bold py-2.5 rounded-xl text-xs transition shadow-sm"
                        >
                          Export & Save JSON Configuration Backup
                        </button>
                      </div>

                      <div className="border-t border-slate-200 dark:border-slate-800 pt-4 space-y-3">
                        <h5 className="text-xs font-bold uppercase tracking-wide opacity-80">Import State Backup</h5>
                        <p className="text-xs opacity-60">Restore your state by pasting your configuration JSON schema directly below:</p>
                        <textarea
                          rows="5"
                          placeholder='Paste JSON schema containing {"version": "2.0.0", "profiles": [...] }'
                          value={importJsonText}
                          onChange={(e) => setImportJsonText(e.target.value)}
                          className={`w-full rounded-xl p-3 text-xs font-mono focus:outline-none ${themeStyles.input}`}
                        />
                        <button
                          type="button"
                          onClick={handleImportState}
                          className="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-sm"
                        >
                          Parse & Restore Local Schema Data
                        </button>
                      </div>

                    </div>
                  </div>
                </div>
              )}

              {/* RapidAPI Key / Settings Modal */}
              {showApiSettingsModal && (
                <div className="fixed inset-0 bg-black/55 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                  <div className={`border rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl animate-scale-up ${themeStyles.card}`}>
                    
                    <div className={`px-6 py-4 border-b flex justify-between items-center ${themeStyles.cardHeader}`}>
                      <div>
                        <h4 className="font-extrabold text-base tracking-tight">RapidAPI Market Connection Settings</h4>
                        <p className="text-[10px] uppercase tracking-widest font-semibold opacity-60">Enable real-time Yahoo Finance multi-asset sync</p>
                      </div>
                      <button
                        onClick={() => setShowApiSettingsModal(false)}
                        className="opacity-60 hover:opacity-100"
                      >
                        <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                      </button>
                    </div>

                    <div className="p-6 space-y-5">
                      <div className="space-y-2">
                        <label className="text-xs font-bold uppercase tracking-wide opacity-75">Your RapidAPI Key ('x-rapidapi-key')</label>
                        <input
                          type="password"
                          placeholder="Paste your RapidAPI key here..."
                          value={customApiKey}
                          onChange={(e) => setCustomApiKey(e.target.value)}
                          className={`w-full rounded-xl px-4 py-3 text-xs font-mono focus:outline-none ${themeStyles.input}`}
                        />
                        <p className="text-[11px] opacity-65 leading-relaxed">
                          Quotes are fetched securely via the <span className="font-semibold text-emerald-500">yh-finance</span> endpoint. All ticker codes are compiled in batch format to save credit consumption. Key values are saved securely only inside your browser's private local storage.
                        </p>
                      </div>

                      <div className="pt-4 border-t border-slate-200/50 flex justify-end">
                        <button
                          type="button"
                          onClick={() => {
                            setShowApiSettingsModal(false);
                            showToast("API configurations saved!", "success");
                          }}
                          className="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 px-6 rounded-xl text-xs transition"
                        >
                          Save Settings
                        </button>
                      </div>
                    </div>

                  </div>
                </div>
              )}

              {/* API Error Panel Modal */}
              {showApiErrorModal && (
                <div className="fixed inset-0 bg-black/55 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                  <div className={`border rounded-2xl max-w-lg w-full overflow-hidden shadow-2xl animate-scale-up ${themeStyles.card}`}>
                    
                    <div className={`px-6 py-5 border-b flex items-center gap-3 ${themeStyles.cardHeader}`}>
                      <div className="w-8 h-8 rounded-lg bg-amber-500/10 border border-amber-500/35 flex items-center justify-center text-amber-500">
                        <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                      </div>
                      <div>
                        <h4 className="font-extrabold text-sm tracking-tight uppercase">API Gateway Sync Details</h4>
                        <p className="text-[10px] uppercase tracking-widest font-semibold opacity-60 font-mono">Authentication Panel & Exception Controller</p>
                      </div>
                    </div>

                    <div className="p-6 space-y-4">
                      <p className="text-xs opacity-65 leading-relaxed">
                        If you encounter an issue syncing live prices, make sure your API Key is valid or configure standard credentials inside the drawer. Alternatively, test the application via the local offline simulator below:
                      </p>

                      <div className="space-y-3 p-4 bg-slate-500/10 rounded-xl border border-slate-300/40">
                        <div className="space-y-1">
                          <label className="text-[10px] font-bold uppercase tracking-wider block text-amber-500">RapidAPI Key Configuration</label>
                          <input
                            type="password"
                            placeholder="Enter Key"
                            value={customApiKey}
                            onChange={(e) => setCustomApiKey(e.target.value)}
                            className={`w-full rounded-lg px-3 py-2 text-xs font-mono focus:outline-none ${themeStyles.input}`}
                          />
                        </div>
                      </div>

                      <div className="bg-slate-900 p-3 rounded-lg border border-slate-800 font-mono text-[10px] text-rose-400 whitespace-pre-wrap max-h-24 overflow-y-auto">
                        {apiErrorMessage}
                      </div>

                      <div className="border-t border-slate-200/50 pt-4 flex flex-col gap-2">
                        <button
                          type="button"
                          onClick={() => {
                            setShowApiErrorModal(false);
                            handleManualRefresh();
                          }}
                          className="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-sm"
                        >
                          Retry with new settings
                        </button>
                        <button
                          type="button"
                          onClick={handleOfflineSimulatorBypass}
                          className="w-full bg-[#22c55e] hover:bg-[#1ebd54] text-white font-bold py-2.5 rounded-xl text-xs transition shadow-sm"
                        >
                          Bypass Sync (Use Offline Simulator Quotes)
                        </button>
                        <button
                          type="button"
                          onClick={() => setShowApiErrorModal(false)}
                          className="w-full bg-slate-100 border border-slate-300 hover:bg-slate-200 text-slate-800 text-xs font-bold py-2.5 rounded-xl transition"
                        >
                          Dismiss Error Console
                        </button>
                      </div>
                    </div>

                  </div>
                </div>
              )}

              <footer className="border-t py-6 px-6 text-center mt-auto border-slate-200 dark:border-slate-800 bg-transparent opacity-80 text-xs font-semibold tracking-wide">
                <p>Developed by Arjun Gupta, IRMS (Accounts) 2023 with help of Gemini AI</p>
              </footer>

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
